### Configure Spring Boot for JavaFX (disable server mode)
spring.main.web-application-type=none
### General
spring.application.name=Liquibase Uploader

### File Manager Configuration
file.manager.project.directory=./project
file.manager.liquibase.directory=./liquibase
file.manager.allowed.extensions=.yaml,.sqlx

# Predefined modules (comma-separated)
file.manager.modules=bjr,cis,col,lac,lc,lms,ibdm,exr
file.manager.default.modules=bjr,cis,col,lac,lc,lms,ibdm,exr,cvn

# Default versions (comma-separated)
file.manager.default.versions=9.0.0.9,9.0.0.10

# Script executor
file.manager.script.executor.command=cmd
liquibase.home.directory=F:/Theta/ctbctw/liquibase


# ============================================
# Auto-Update Configuration (GitHub Releases)
# ============================================
# Enable/disable auto-update check on startup
update.enabled=true
# GitHub repository settings
# Example: for https://github.com/arif2fast/ctbctwTools
update.github.owner=thetaarif
update.github.repo=ctbctwTools
# Pattern to match JAR file in release assets (supports * wildcard)
update.github.asset-pattern=*.jar
# Timeout in seconds for API requests
update.timeout-seconds=5